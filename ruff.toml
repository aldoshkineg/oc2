# Lint ./oc and tests/ (target: make lint). Valid for python >= 3.11.
target-version = "py311"
line-length = 88

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # warnings (whitespace/line breaks)
  "F",   # pyflakes: unused, undefined names
  "I",   # import sorting
  "UP",  # outdated types/syntax
]
