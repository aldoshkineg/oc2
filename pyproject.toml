[project]
name = "oc2"
version = "0.1.0"
description = "Utility for isolating opencode runs in a container with per-project settings"
readme = "README.md"
license = "MIT"
authors = [{ name = "Eugene Aldoshkin" }]
requires-python = ">=3.11"

# Runtime: stdlib only (python >= 3.11, tomllib); the ./oc script has no pip
# dependencies. All development tools are a dev group (PEP 735), installed
# through uv.

[dependency-groups]
dev = [
  "pre-commit",
  "pytest",
  "ruff",
]

# A script project: nothing to build or install, only a venv with dev deps.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
