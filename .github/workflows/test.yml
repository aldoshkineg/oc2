name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # the minimum ./oc requires (tomllib)
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest
